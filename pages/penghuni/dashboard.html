<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Dashboard · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/kelompok/penghuni/dashboard.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/penghuni/dashboard.js" defer></script>
</head>
<body data-layout="akun" data-akses="penghuni" data-menu="dashboard" data-judul="Dashboard">
  <main>
    <div class="welcome-heading">
      <h1 id="sapaan">Selamat datang</h1>
      <p id="subKamar">Berikut ringkasan informasi hunian kamu.</p>
    </div>

    <section class="bill-alert" id="bannerTagihan" hidden>
      <div class="bill-alert-copy"><span class="alert-clock" aria-hidden="true">◷</span><span id="teksTagihan">Memuat informasi tagihan...</span></div>
      <a href="#" class="primary-button" id="tombolBayar">Bayar Sekarang</a>
    </section>

    <section class="summary-grid" aria-label="Ringkasan penghuni">
      <article class="summary-card">
        <p class="card-label">Masa Sewa</p>
        <h2 id="masaSewa">-</h2>
        <a href="perpanjangan.html">Perpanjang <span>→</span></a>
      </article>
      <article class="summary-card">
        <p class="card-label">Laporan Kerusakan</p>
        <h2 id="jumlahLaporan">Belum ada laporan</h2>
        <a href="laporan.html" id="lihatLaporan">Lihat <span>→</span></a>
      </article>
      <article class="summary-card">
        <p class="card-label">Pembayaran Terakhir</p>
        <div class="last-payment-line"><h2 id="bayarTerakhir">-</h2><span class="status-pill" id="statusBayar" hidden>Lunas</span></div>
        <a href="riwayat.html">Riwayat <span>→</span></a>
      </article>
    </section>

    <section class="room-card">
      <h2 class="section-card-title">Kamar Saya</h2>
      <div class="room-detail">
        <img id="fotoKamar" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Foto kamar penghuni">
        <div class="room-info">
          <h3 id="namaKamar">Informasi kamar</h3>
          <p class="room-price" id="hargaKamar">-</p>
          <p class="room-period">Periode sewa: <span id="periodeKamar">-</span></p>
          <a href="#" class="secondary-button" id="detailKamar">Lihat Detail Kamar</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
