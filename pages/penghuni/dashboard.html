<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Dashboard · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/pages/penghuni.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/penghuni/dashboard.js" defer></script>
</head>
<body data-layout="akun" data-akses="penghuni" data-menu="dashboard" data-judul="Dashboard">
  <main>
    <div class="kepala-halaman">
      <div>
        <h1 id="sapaan">Selamat datang</h1>
        <p class="sub" id="subKamar">-</p>
      </div>
    </div>

    <div class="kotak-status kotak-status--peringatan mb-6" id="bannerTagihan" hidden>
      <i data-ikon="schedule"></i>
      <p class="isi-lentur" id="teksTagihan"></p>
      <a class="tombol tombol--utama" id="tombolBayar" href="#">Bayar Sekarang</a>
    </div>

    <div class="grid-3 mb-6">
      <section class="kartu statistik" aria-labelledby="lblSewa">
        <p class="statistik-label" id="lblSewa"><i data-ikon="calendar_today" class="kecil"></i>Masa Sewa</p>
        <p class="statistik-nilai sedang" id="masaSewa">-</p>
        <p class="statistik-ket" id="ketSewa"></p>
        <a class="tautan-lihat" href="perpanjangan.html">Perpanjang<i data-ikon="arrow_forward"></i></a>
      </section>
      <section class="kartu statistik" aria-labelledby="lblLaporan">
        <p class="statistik-label" id="lblLaporan"><i data-ikon="build" class="kecil"></i>Laporan Kerusakan</p>
        <p class="statistik-nilai sedang" id="jumlahLaporan">-</p>
        <p class="statistik-ket" id="ketLaporan"></p>
        <a class="tautan-lihat" id="lihatLaporan" href="laporan.html">Lihat<i data-ikon="arrow_forward"></i></a>
      </section>
      <section class="kartu statistik" aria-labelledby="lblBayar">
        <p class="statistik-label" id="lblBayar"><i data-ikon="history" class="kecil"></i>Pembayaran Terakhir</p>
        <p class="statistik-nilai sedang" id="bayarTerakhir">-</p>
        <p class="statistik-ket" id="ketBayar"></p>
        <a class="tautan-lihat" href="riwayat.html">Riwayat<i data-ikon="arrow_forward"></i></a>
      </section>
    </div>

    <section class="kartu" aria-labelledby="judulKamar">
      <h2 class="kartu-judul" id="judulKamar">Kamar Saya</h2>
      <div class="ringkas-kamar kamar-saya">
        <img id="fotoKamar" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
        <div>
          <h3 id="namaKamar">-</h3>
          <p><strong class="harga" id="hargaKamar">-</strong> <span class="muted kecil">/ bulan</span></p>
          <p class="kecil muted" id="periodeKamar"></p>
        </div>
        <a class="tombol tombol--sekunder" id="detailKamar" href="#">Lihat Detail Kamar</a>
      </div>
    </section>
  </main>
</body>
</html>
