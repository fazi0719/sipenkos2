<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Riwayat Pembayaran — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Riwayat Pembayaran · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/kelompok/penghuni/riwayat-pembayaran.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/penghuni/riwayat.js" defer></script>
</head>
<body data-layout="akun" data-akses="penghuni" data-menu="riwayat" data-judul="Riwayat Pembayaran">
  <main>
    <div class="riwayat-heading">
      <h1>Riwayat Pembayaran</h1>
      <p>Daftar transaksi pembayaran sewa kamu</p>
    </div>

    <div class="riwayat-filter">
      <label for="filterBulan">Bulan</label>
      <select id="filterBulan" class="filter-bulan">
        <option value="">Semua bulan</option>
      </select>
      <button type="button" id="resetFilter" class="btn-reset-filter" hidden>Reset</button>
      <span class="filter-info" id="infoFilter"></span>
    </div>

    <div class="riwayat-card">
      <div class="table-responsive">
        <table class="tabel-riwayat">
          <thead>
            <tr>
              <th>Tanggal Bayar</th>
              <th>Kamar</th>
              <th>Jenis</th>
              <th>Jumlah</th>
              <th>Metode</th>
              <th>Status</th>
              <th>Bukti</th>
            </tr>
          </thead>
          <tbody id="isiTabel">
            <tr><td colspan="7" class="loading-riwayat">Memuat riwayat pembayaran...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
