<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buat Laporan Kerusakan — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Buat Laporan Kerusakan · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/penghuni/laporan-buat.js" defer></script>
</head>
<body data-layout="akun" data-akses="penghuni" data-menu="laporan" data-judul="Buat Laporan Kerusakan">
  <main>
    <a class="tautan-kembali" href="laporan.html"><i data-ikon="arrow_back"></i>Kembali ke Laporan Kerusakan</a>
    <div class="kepala-halaman">
      <div>
        <h1>Buat Laporan Baru</h1>
        <p class="sub">Jelaskan kerusakan agar pemilik kos bisa segera menindaklanjuti</p>
      </div>
    </div>

    <form class="kartu form form-sempit" id="formLaporan" novalidate>
      <div class="field">
        <label class="label" for="lokasi">Lokasi</label>
        <div class="input-ikon"><input type="text" class="input" id="lokasi" readonly><i data-ikon="lock"></i></div>
      </div>
      <div class="field">
        <label class="label" for="kategori">Kategori</label>
        <div class="input-ikon"><select class="select" id="kategori" name="kategori"></select><i data-ikon="expand_more"></i></div>
      </div>
      <div class="field">
        <label class="label" for="judul">Judul Kerusakan</label>
        <input type="text" class="input" id="judul" name="judul" maxlength="80" placeholder="Contoh: Keran air wastafel patah">
      </div>
      <div class="field">
        <label class="label" for="deskripsi">Deskripsi</label>
        <textarea class="textarea" id="deskripsi" name="deskripsi" maxlength="1000" placeholder="Jelaskan detail kerusakan, waktu kejadian, atau kendala yang dialami..."></textarea>
      </div>
      <div class="field">
        <span class="label" id="labelFoto">Foto Kerusakan <span class="opsional">(Opsional)</span></span>
        <div id="unggahFoto" role="group" aria-labelledby="labelFoto"></div>
      </div>
      <div class="kaki-form">
        <a class="tombol tombol--batal" href="laporan.html">Batal</a>
        <button type="submit" class="tombol tombol--utama"><i data-ikon="send"></i>Kirim Laporan</button>
      </div>
    </form>
  </main>
</body>
</html>
