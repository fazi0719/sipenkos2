<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Laporan Keuangan — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Laporan Keuangan · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/pemilik/keuangan.js" defer></script>
</head>
<body data-layout="akun" data-akses="pemilik" data-menu="keuangan" data-judul="Laporan Keuangan">
  <main>
    <div class="kepala-halaman">
      <div>
        <h1>Laporan Keuangan</h1>
        <p class="sub">Pendapatan sewa berdasarkan pembayaran yang sudah dikonfirmasi</p>
      </div>
      <div class="baris-tombol">
        <div class="field">
          <label class="sr-only" for="tahun">Tahun</label>
          <div class="input-ikon"><select class="select" id="tahun"></select><i data-ikon="expand_more"></i></div>
        </div>
        <button type="button" class="tombol tombol--sekunder" id="cetak"><i data-ikon="print"></i>Cetak</button>
      </div>
    </div>

    <div class="grid-3 mb-6" id="statistik"></div>

    <section class="kartu mb-6" aria-labelledby="judulGrafik">
      <h2 class="kartu-judul" id="judulGrafik">Pendapatan per Bulan</h2>
      <div class="grafik" id="grafik" role="img"></div>
    </section>

    <div class="grid-2 grid-atas">
      <section class="kartu kartu--rapat" aria-labelledby="judulTransaksi">
        <div class="kartu-kepala kepala-tabel"><h2 class="kartu-judul" id="judulTransaksi">Transaksi Masuk</h2></div>
        <div class="tabel-gulir">
          <table class="tabel tabel--responsif">
            <caption class="sr-only">Transaksi masuk</caption>
            <thead><tr><th scope="col">Tanggal</th><th scope="col">Penghuni</th><th scope="col" class="angka">Jumlah</th></tr></thead>
            <tbody id="tabelTransaksi"></tbody>
          </table>
        </div>
      </section>
      <section class="kartu kartu--rapat" aria-labelledby="judulTunggakan">
        <div class="kartu-kepala kepala-tabel"><h2 class="kartu-judul" id="judulTunggakan">Tunggakan</h2></div>
        <div class="tabel-gulir">
          <table class="tabel tabel--responsif">
            <caption class="sr-only">Tagihan yang lewat jatuh tempo</caption>
            <thead><tr><th scope="col">Penghuni</th><th scope="col">Periode</th><th scope="col" class="angka">Jumlah</th></tr></thead>
            <tbody id="tabelTunggakan"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
