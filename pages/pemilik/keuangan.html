<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Laporan Keuangan — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Laporan Keuangan · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/kelompok/admin/style.css">
  <link rel="stylesheet" href="../../assets/css/kelompok/admin/responsive.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/pemilik/admin-ui.js" defer></script>
  <script src="../../assets/js/pages/pemilik/keuangan.js" defer></script>
</head>
<body data-layout="akun" data-akses="pemilik" data-menu="keuangan" data-judul="Laporan Keuangan">
  <main>
    <div class="page-header">
      <div>
        <h1 class="page-title">Laporan Keuangan</h1>
        <p class="page-subtitle">Pantau pendapatan sewa, pembayaran yang menunggu, dan tunggakan kos</p>
      </div>
      <div class="page-actions">
        <label class="select-btn"><i class="icon icon-calendar" aria-hidden="true"></i><span class="sr-only">Periode</span><select id="periode" class="select-polos"></select><i class="icon icon-chevron-down" aria-hidden="true"></i></label>
        <button type="button" class="btn btn-secondary btn-sm" id="cetak">Unduh Laporan</button>
      </div>
    </div>
    <section class="stats stats-3" aria-label="Ringkasan keuangan" id="statistik"></section>
    <div class="card">
      <div class="card-head card-head-bar">
        <h2 class="card-title">Pemasukan Sewa</h2>
      </div>
      <div class="table-wrap">
        <table class="table table-keuangan">
          <thead>
            <tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th class="ta-right">Nominal</th></tr>
          </thead>
          <tbody id="tabelTransaksi"></tbody>
          <tfoot><tr><td>Total</td><td></td><td></td><td class="ta-right nowrap" id="totalTransaksi">-</td></tr></tfoot>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-head card-head-bar">
        <h2 class="card-title">Tunggakan</h2>
      </div>
      <div class="table-wrap">
        <table class="table table-keuangan">
          <thead>
            <tr><th>Jatuh Tempo</th><th>Penghuni</th><th>Keterangan</th><th class="ta-right">Nominal</th></tr>
          </thead>
          <tbody id="tabelTunggakan"></tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
