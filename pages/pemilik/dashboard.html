<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard Pemilik — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Dashboard Pemilik · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/kelompok/admin/style.css">
  <link rel="stylesheet" href="../../assets/css/kelompok/admin/responsive.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/pemilik/admin-ui.js" defer></script>
  <script src="../../assets/js/pages/pemilik/dashboard.js" defer></script>
</head>
<body data-layout="akun" data-akses="pemilik" data-menu="dashboard" data-judul="Dashboard Pemilik">
  <main>
    <div class="page-header">
      <div>
        <h1 class="page-title" id="sapaan">Selamat datang</h1>
        <p class="page-subtitle" id="subjudul">Ringkasan aktivitas Kos Bu Nining</p>
      </div>
    </div>
    <div class="banner banner-warning" id="dashboard-banner" hidden>
      <div class="banner-body">
        <i class="icon icon-triangle-alert" aria-hidden="true"></i><span id="bannerTeks"></span>
      </div>
      <a href="pembayaran.html" class="btn btn-primary btn-md" id="bannerAksi">Verifikasi Sekarang</a>
    </div>
    <section class="stats stats-4" aria-label="Statistik kamar" id="statistik"></section>
    <section class="grid-2">
      <div class="card dashboard-card-pad">
        <div class="card-head">
          <h2 class="card-title">Perlu Ditindaklanjuti</h2>
          <span id="jumlahTugas"></span>
        </div>
        <div class="task-list" id="tugas"></div>
      </div>
      <div class="card dashboard-card-pad occupancy-card">
        <div class="card-head">
          <h2 class="card-title">Okupansi per Tipe Kamar</h2>
          <a href="kamar.html" class="btn btn-ghost btn-sm">Lihat Semua</a>
        </div>
        <div class="occupancy" id="okupansi"></div>
      </div>
    </section>
  </main>
