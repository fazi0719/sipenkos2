<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masuk — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Masuk · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/auth/bersama.js" defer></script>
  <script src="../../assets/js/pages/auth/masuk.js" defer></script>
</head>
<body data-layout="auth" data-akses="tamu" data-judul="Masuk">
  <main>
    <div class="kartu tumpuk">
      <div class="teks-tengah"><a class="logo" href="../../index.html"><span class="logo-nama">SIPENK<i data-ikon="home"></i>S</span><span class="logo-pemisah"></span><span class="logo-kos">Kos Bu Nining</span></a></div>

      <div class="kotak-info kotak-info--biru" id="infoReservasi" hidden><i data-ikon="info"></i><p></p></div>

      <h1 class="judul-auth">Masuk ke SIPENKOS</h1>

      <form class="form" id="formMasuk" novalidate>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com">
        </div>
        <div class="field">
          <label class="label" for="sandi">Kata Sandi</label>
          <div class="input-ikon">
            <input class="input" id="sandi" name="sandi" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi">
            <button type="button" class="tombol tombol--ikon" data-lihat-sandi="sandi" aria-label="Tampilkan kata sandi"><i data-ikon="visibility"></i></button>
          </div>
        </div>
        <div class="baris-tombol baris-tombol--antara">
          <label class="cek"><input type="checkbox" name="ingat" checked>Ingat saya</label>
          <button type="button" class="tombol tombol--teks kecil" id="lupaSandi">Lupa kata sandi?</button>
        </div>
        <p class="pesan-error" id="pesanMasuk" role="alert" hidden></p>
        <button type="submit" class="tombol tombol--utama tombol--penuh">Masuk</button>
      </form>

      <p class="kecil muted teks-tengah">Belum punya akun? <a id="keDaftar" href="daftar.html">Daftar sekarang</a></p>
    </div>
  </main>
</body>
</html>
