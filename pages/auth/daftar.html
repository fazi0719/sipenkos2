<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daftar Akun — SIPENKOS, sistem pengelolaan dan reservasi Kos Bu Nining Malang.">
  <title>Daftar Akun · SIPENKOS</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/kelompok/calon-penghuni/style.css">
  <link rel="stylesheet" href="../../assets/css/kelompok/calon-penghuni/auth.css">

  <!-- inti aplikasi (urutan penting) -->
  <script src="../../assets/js/core/config.js" defer></script>
  <script src="../../assets/js/core/icons.js" defer></script>
  <script src="../../assets/js/core/format.js" defer></script>
  <script src="../../assets/js/core/seed.js" defer></script>
  <script src="../../assets/js/core/store.js" defer></script>
  <script src="../../assets/js/core/ui.js" defer></script>
  <script src="../../assets/js/core/shell.js" defer></script>

  <!-- skrip khusus halaman ini -->
  <script src="../../assets/js/pages/auth/bersama.js" defer></script>
  <script src="../../assets/js/pages/auth/daftar.js" defer></script>
</head>
<body data-layout="auth" data-akses="tamu" data-judul="Daftar Akun">
  <main>
    <div class="auth-container">
      <div class="card-box auth-card">
        <div class="auth-logo">
          <a href="../../index.html" class="k-logo" aria-label="SIPENKOS Kos Bu Nining, ke beranda">
            <span class="k-logo-judul"><span>SIPENK</span><svg class="a-logo-rumah" viewBox="0 0 18 16" aria-hidden="true"><path d="M2 7.2 9 1.6l7 5.6V14.4H2Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 14.4V9.6h4v4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>S</span></span>
            <span class="k-logo-divider" aria-hidden="true"></span>
            <span class="k-logo-pendukung">Kos Bu Nining</span>
          </a>
        </div>
        <div class="informasi" id="infoReservasi">
          <span class="icon">ℹ️</span>
          <span id="infoReservasiTeks">Buat akun untuk melanjutkan reservasi kamar yang anda pilih</span>
        </div>
        <div class="auth-header">
          <h1 class="judul-box">Buat Akun</h1>
          <p class="deskripsi">Lengkapi data diri kamu untuk mulai membuat akun.</p>
        </div>
        <form class="auth-form" id="formDaftar" novalidate>
          <div class="form-group">
            <label for="nama" class="form-label">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" class="form-input" placeholder="Nama lengkap sesuai KTP" autocomplete="name">
          </div>
          <div class="form-group">
            <label for="nik" class="form-label">NIK</label>
            <input type="text" id="nik" name="nik" class="form-input" placeholder="16 digit angka sesuai KTP" inputmode="numeric" maxlength="16" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="hp" class="form-label">Nomor HP / WhatsApp</label>
            <input type="tel" id="hp" name="hp" class="form-input" placeholder="08xxxxxxxxxx" inputmode="tel" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="nama@email.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label for="sandi" class="form-label">Kata Sandi</label>
            <div class="input-password-wrapper">
              <input type="password" id="sandi" name="sandi" class="form-input" placeholder="Masukkan kata sandi kamu" autocomplete="new-password">
            </div>
          </div>
          <div class="form-group">
            <label for="sandi2" class="form-label">Konfirmasi Kata Sandi</label>
            <div class="input-password-wrapper">
              <input type="password" id="sandi2" name="sandi2" class="form-input" placeholder="Ulangi kata sandi kamu" autocomplete="new-password">
            </div>
          </div>
          <div class="form-checkbox">
            <input type="checkbox" id="persetujuan" name="setuju">
            <label for="persetujuan">Saya menyetujui <a href="../akun/aturan.html" target="_blank" rel="noopener">aturan kos</a></label>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Daftar</button>
        </form>
        <div class="auth-footer-card">
          Sudah punya akun? <a href="masuk.html" class="link-auth" id="keMasuk">Masuk</a>
        </div>
      </div>
      <a href="../publik/kamar.html" class="back-link back-link-center">← Kembali ke Daftar Kamar</a>
    </div>
  </main>
</body>
</html>
